<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro TV 90s</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .tv-frame {
      background: #3d2314;
      border: 12px solid #26140a;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
      width: 95vw;
      max-width: 650px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .screen-container {
      position: relative;
      width: 100%;
      height: 60vh;
      max-height: 400px;
      background-color: #050505;
      border-radius: 30px;
      overflow: hidden;
      border: 8px solid #1a0f08;
      box-shadow: inset 0 0 20px rgba(0,0,0,1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background-color: #000;
    }

    .osd-logo {
      position: absolute;
      top: 20px;
      left: 20px;
      border: 2px solid #00ffff;
      color: #00ffff;
      padding: 5px 10px;
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      box-shadow: 0 0 10px #00ffff;
      background: rgba(0, 0, 0, 0.5);
      z-index: 10;
      pointer-events: none;
    }

    .controls-panel {
      width: 100%;
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .btn {
      background: #2a2a2a;
      color: #fff;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 12px 5px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      box-shadow: 0 4px 0 #111;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: none;
    }

    .btn-guia { background: #b8860b; color: #fff; }
    .btn-anadir { background: #006400; color: #fff; }
    .btn-full { background: #00008b; color: #fff; }
    .btn-power { background: #8b0000; color: #fff; }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <div class="tv-frame">
    <div class="screen-container">
      <div class="osd-logo">retro tv 90s</div>
      <video id="tvPlayer" autoplay loop muted playsinline></video>
    </div>

    <div class="controls-panel">
      <button class="btn" onclick="nextChannel()"><i class="fas fa-chevron-up"></i> CH ▲</button>
      <button class="btn" onclick="prevChannel()"><i class="fas fa-chevron-down"></i> CH ▼</button>
      <button class="btn" onclick="volUp()"><i class="fas fa-volume-up"></i> VOL +</button>
      <button class="btn" onclick="volDown()"><i class="fas fa-volume-down"></i> VOL -</button>
      
      <button class="btn btn-guia" onclick="showGuide()"><i class="fas fa-list"></i> GUÍA</button>
      <button class="btn btn-anadir" onclick="document.getElementById('fileInput').click()"><i class="fas fa-folder-open"></i> AÑADIR</button>
      <button class="btn btn-full" onclick="toggleFullScreen()"><i class="fas fa-expand"></i> FULL</button>
      <button class="btn btn-power" onclick="togglePower()"><i class="fas fa-power-off"></i> POWER</button>
    </div>
  </div>

  <!-- Input oculto para cargar carpetas o videos -->
  <input type="file" id="fileInput" webkitdirectory directory multiple accept="video/*" onchange="handleFiles(this.files)">

  <script>
    const player = document.getElementById('tvPlayer');
    let playlist = [];
    let currentIndex = 0;

    // --- GUARDAR Y CARGAR CANALES (localStorage) ---
    function savePlaylist() {
      localStorage.setItem('retro_tv_saved_playlist', JSON.stringify(playlist));
    }

    function loadSavedPlaylist() {
      const saved = localStorage.getItem('retro_tv_saved_playlist');
      if (saved) {
        playlist = JSON.parse(saved);
        if (playlist.length > 0) {
          playCurrent();
        }
      }
    }

    // --- MANEJO DE ARCHIVOS Y CARPETAS ---
    function handleFiles(files) {
      const newFiles = Array.from(files).filter(file => file.type.startsWith('video/'));
      if (newFiles.length === 0) {
        alert("No se encontraron videos válidos en la carpeta seleccionada.");
        return;
      }

      // Generar URLs para reproducción local
      playlist = newFiles.map(file => URL.createObjectURL(file));
      currentIndex = 0;
      
      // Guardar nombres o rutas referenciales en memoria
      const fileNames = newFiles.map(file => file.name);
      localStorage.setItem('retro_tv_file_names', JSON.stringify(fileNames));

      playCurrent();
      alert(`¡Se cargaron ${newFiles.length} videos de la carpeta!`);
    }

    function playCurrent() {
      if (playlist.length === 0) return;
      player.src = playlist[currentIndex];
      player.play().catch(e => console.log("Autoplay bloquado por navegador:", e));
    }

    function nextChannel() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex + 1) % playlist.length;
      playCurrent();
    }

    function prevChannel() {
      if (playlist.length === 0) return;
      currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
      playCurrent();
    }

    function volUp() {
      player.muted = false;
      player.volume = Math.min(1, player.volume + 0.1);
    }

    function volDown() {
      player.muted = false;
      player.volume = Math.max(0, player.volume - 0.1);
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        player.requestFullscreen().catch(err => alert(err.message));
      } else {
        document.exitFullscreen();
      }
    }

    function togglePower() {
      if (player.style.display === 'none') {
        player.style.display = 'block';
        player.play();
      } else {
        player.style.display = 'none';
        player.pause();
      }
    }

    function showGuide() {
      const savedNames = localStorage.getItem('retro_tv_file_names');
      if (savedNames) {
        const names = JSON.parse(savedNames);
        alert("Lista de Canales / Archivos cargados:\n\n" + names.join("\n"));
      } else {
        alert("Aún no has añadido ninguna carpeta de canales.");
      }
    }

    // Inicializar al abrir la app
    document.addEventListener('DOMContentLoaded', () => {
      loadSavedPlaylist();
    });
  </script>
</body>
</html>
