<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro TV 90</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  
  <!-- Librerías para canales en vivo (.m3u8) y YouTube -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #fff;
      font-family: 'VT323', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      padding: 10px;
    }

    /* Carcasa del Televisor */
    .tv-casing {
      background: linear-gradient(145deg, #3a3835, #232220);
      border: 6px solid #1a1918;
      border-radius: 28px;
      padding: 22px;
      width: 100%;
      max-width: 960px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), inset 0 2px 5px rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Marco interior de la pantalla */
    .screen-bezel {
      background: #0d0d0d;
      border-radius: 22px;
      padding: 14px;
      box-shadow: inset 0 0 25px #000;
      border: 3px solid #2b2927;
    }

    /* Pantalla CRT */
    .crt-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #050505;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.95);
    }

    /* Video y Reproductor YouTube */
    video, #yt-player-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #yt-player-wrapper {
      pointer-events: none;
      display: none;
      transform: scale(1.06); /* Recorta bordes negros de YouTube */
    }

    /* Efecto Scanlines y Viñeta CRT */
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.35) 50%
      ), linear-gradient(
        90deg,
        rgba(255, 0, 0, 0.04),
        rgba(0, 255, 0, 0.01),
        rgba(0, 0, 255, 0.04)
      );
      background-size: 100% 4px, 6px 100%;
      pointer-events: none;
      z-index: 10;
    }

    .crt-vignette {
      position: absolute;
      inset: 0;
      box-shadow: inset 0 0 70px rgba(0,0,0,0.85);
      border-radius: 16px;
      pointer-events: none;
      z-index: 11;
    }

    /* Pantalla apagada / Estática */
    .static-noise {
      position: absolute;
      inset: 0;
      background-color: #111;
      background-image: radial-gradient(#444 1px, transparent 0);
      background-size: 4px 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .static-noise.active {
      opacity: 1;
    }

    .tv-off-screen {
      position: absolute;
      inset: 0;
      background: #050505;
      z-index: 20;
      display: none;
    }

    /* OSD (Texto verde estilo tele vieja) */
    .osd-overlay {
      position: absolute;
      top: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 15;
      pointer-events: none;
      text-shadow: 2px 2px 0px #000, -1px -1px 0 #000;
      transition: opacity 0.5s ease;
    }

    .osd-hidden {
      opacity: 0;
    }

    .osd-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .osd-channel-num {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 3vw, 28px);
      color: #39ff14;
    }

    .osd-channel-name {
      font-size: clamp(18px, 2.5vw, 24px);
      color: #fff;
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 8px;
      border-left: 4px solid #39ff14;
    }

    .osd-program {
      font-size: clamp(15px, 2vw, 20px);
      color: #ffea00;
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 8px;
    }

    .osd-badge {
      background: #d90429;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      padding: 6px 10px;
      border-radius: 4px;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Panel de Controles Físicos */
    .control-panel {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: #1f1e1c;
      padding: 14px 20px;
      border-radius: 16px;
      border: 2px solid #33312e;
      gap: 15px;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-retro {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #e0e0e0;
      letter-spacing: 1px;
    }

    .brand-90 {
      background: #ff5400;
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 4px 7px;
      border-radius: 4px;
    }

    .buttons-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .retro-btn {
      background: linear-gradient(180deg, #4a4845, #2e2d2b);
      color: #f0f0f0;
      border: 2px solid #141414;
      border-bottom: 5px solid #111;
      border-radius: 8px;
      padding: 10px 14px;
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      cursor: pointer;
      transition: transform 0.08s, border-bottom 0.08s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .retro-btn:active {
      transform: translateY(3px);
      border-bottom: 2px solid #111;
    }

    .btn-power {
      background: linear-gradient(180deg, #c1121f, #780000);
      color: #fff;
    }

    .led-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #39ff14;
      box-shadow: 0 0 8px #39ff14;
    }

    .led-indicator.off {
      background: #4a0000;
      box-shadow: none;
    }

    /* Selector Rápido de Canales (Parrilla) */
    .channel-guide {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .channel-chip {
      background: #2b2927;
      border: 1px solid #444;
      color: #ccc;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .channel-chip:hover {
      background: #3d3a37;
      color: #fff;
    }

    .channel-chip.active {
      background: #39ff14;
      color: #000;
      font-weight: bold;
      border-color: #39ff14;
    }
  </style>
</head>
<body>

  <div class="tv-casing">
    <!-- Pantalla -->
    <div class="screen-bezel">
      <div class="crt-screen" id="crt-screen">
        <!-- Reproductor HLS en vivo -->
        <video id="hls-video" playsinline></video>
        
        <!-- Contenedor YouTube -->
        <div id="yt-player-wrapper">
          <div id="yt-player"></div>
        </div>

        <!-- Estática al cambiar canal -->
        <div class="static-noise" id="static-screen">
          <span style="font-family: 'Press Start 2P'; color: #fff; background: #000; padding: 8px;">SINTONIZANDO...</span>
        </div>

        <!-- Pantalla negra cuando está apagada -->
        <div class="tv-off-screen" id="tv-off-screen"></div>

        <!-- OSD Info del Canal -->
        <div class="osd-overlay" id="osd-overlay">
          <div class="osd-left">
            <div class="osd-channel-num" id="osd-num">CH 02</div>
            <div class="osd-channel-name" id="osd-name">CARGANDO SEÑAL...</div>
            <div class="osd-program" id="osd-prog">Presiona un botón si no hay audio</div>
          </div>
          <div class="osd-badge" id="osd-badge">EN VIVO</div>
        </div>

        <!-- Efectos CRT -->
        <div class="scanlines"></div>
        <div class="crt-vignette"></div>
      </div>
    </div>

    <!-- Barra rápida de canales -->
    <div class="channel-guide" id="channel-guide"></div>

    <!-- Panel de Controles -->
    <div class="control-panel">
      <div class="brand-logo">
        <div class="led-indicator" id="power-led"></div>
        <span class="brand-retro">RETRO</span>
        <span class="brand-90">TV 90</span>
      </div>

      <div class="buttons-group">
        <button class="retro-btn" onclick="canalAnterior()">CH -</button>
        <button class="retro-btn" onclick="canalSiguiente()">CH +</button>
        <button class="retro-btn" onclick="toggleMute()" id="btn-mute">🔊 AUDIO</button>
        <button class="retro-btn" onclick="mostrarOSD()">INFO</button>
        <button class="retro-btn btn-power" onclick="togglePower()">POWER</button>
      </div>
    </div>
  </div>

  <script>
    // ========================================================
    // PARRILLA DE CANALES CONFIGURADOS
    // ========================================================
    const CANALES = [
      {
        numero: "02",
        corto: "CH 02 Caricaturas",
        nombre: "CANAL 02 - CARICATURAS RETRO",
        programa: "Maratón Clásicos Animados",
        tipo: "youtube",
        // Playlist de caricaturas retro clásicas
        playlistId: "PL7XlqX4npddfrdpMCxBnNZXg2GFll7t5y"
      },
      {
        numero: "03",
        corto: "CH 03 Anime",
        nombre: "CANAL 03 - ANIME CLÁSICO",
        programa: "Bloque Retro Anime 24/7",
        tipo: "youtube",
        // Playlist de episodios completos de anime clásico oficial
        playlistId: "PLxSscENEp7Jis5543635_7X1w1216337_"
      },
      {
        numero: "04",
        corto: "CH 04 Lucha Libre",
        nombre: "CANAL 04 - LUCHA LIBRE",
        programa: "Funciones Estelares AAA",
        tipo: "youtube",
        // Playlist oficial de Lucha Libre AAA Worldwide
        playlistId: "PL9352431377997654"
      },
      {
        numero: "05",
        corto: "CH 05 Deportes",
        nombre: "CANAL 05 - DEPORTES EN VIVO",
        programa: "Red Bull TV Deportes Extremos",
        tipo: "hls",
        url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8"
      },
      {
        numero: "06",
        corto: "CH 06 Películas",
        nombre: "CANAL 06 - CINE RETRO Y CULT",
        programa: "Función Estelar Clásica",
        tipo: "youtube",
        // Playlist de películas completas clásicas
        playlistId: "PL3002579207484830"
      },
      {
        numero: "07",
        corto: "CH 07 Series",
        nombre: "CANAL 07 - SERIES CLÁSICAS",
        programa: "Maratón Series Retro",
        tipo: "youtube",
        // Playlist de series retro
        playlistId: "PL5323338982834221"
      },
      {
        numero: "08",
        corto: "CH 08 Noticias",
        nombre: "CANAL 08 - DW ESPAÑOL EN VIVO",
        programa: "Transmisión Internacional 24/7",
        tipo: "hls",
        url: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8"
      }
    ];

    // ========================================================
    // VARIABLES DE ESTADO DEL TELEVISOR
    // ========================================================
    let canalActualIdx = 0;
    let tvEncendida = true;
    let silenciado = false;
    let hlsInstance = null;
    let ytPlayer = null;
    let ytApiLista = false;
    let osdTimeout = null;

    const videoEl = document.getElementById("hls-video");
    const ytWrapper = document.getElementById("yt-player-wrapper");
    const staticScreen = document.getElementById("static-screen");
    const offScreen = document.getElementById("tv-off-screen");
    const osdOverlay = document.getElementById("osd-overlay");
    const guideContainer = document.getElementById("channel-guide");

    // Crear botones rápidos de la guía de canales
    function renderizarGuia() {
      guideContainer.innerHTML = "";
      CANALES.forEach((canal, idx) => {
        const btn = document.createElement("button");
        btn.className = `channel-chip ${idx === canalActualIdx ? "active" : ""}`;
        btn.textContent = canal.corto;
        btn.onclick = () => sintonizarCanal(idx);
        guideContainer.appendChild(btn);
      });
    }

    // Inicializar API de YouTube cuando esté lista
    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          modestbranding: 1,
          rel: 0,
          showinfo: 0,
          iv_load_policy: 3,
          playsinline: 1
        },
        events: {
          onReady: () => {
            ytApiLista = true;
            sintonizarCanal(canalActualIdx);
          },
          onError: () => {
            // Si algún video de la playlist está bloqueado, salta al siguiente automáticamente
            if (ytPlayer && ytPlayer.nextVideo) {
              ytPlayer.nextVideo();
            }
          }
        }
      });
    };

    // Mostrar cartel verde OSD temporalmente
    function mostrarOSD() {
      if (!tvEncendida) return;
      osdOverlay.classList.remove("osd-hidden");
      clearTimeout(osdTimeout);
      osdTimeout = setTimeout(() => {
        osdOverlay.classList.add("osd-hidden");
      }, 4500);
    }

    // Función principal para cambiar de canal
    function sintonizarCanal(index) {
      if (!tvEncendida) return;

      if (index >= CANALES.length) index = 0;
      if (index < 0) index = CANALES.length - 1;
      canalActualIdx = index;

      const canal = CANALES[canalActualIdx];

      // Efecto breve de estática al cambiar
      staticScreen.classList.add("active");
      setTimeout(() => staticScreen.classList.remove("active"), 450);

      // Actualizar textos OSD y chips
      document.getElementById("osd-num").textContent = `CH ${canal.numero}`;
      document.getElementById("osd-name").textContent = canal.nombre;
      document.getElementById("osd-prog").textContent = canal.programa;
      renderizarGuia();
      mostrarOSD();

      // Limpiar reproductores anteriores
      if (hlsInstance) {
        hlsInstance.destroy();
        hlsInstance = null;
      }
      videoEl.pause();
      videoEl.removeAttribute("src");

      // MODO 1: STREAM EN VIVO (.m3u8)
      if (canal.tipo === "hls") {
        ytWrapper.style.display = "none";
        if (ytApiLista && ytPlayer.stopVideo) ytPlayer.stopVideo();
        videoEl.style.display = "block";
        videoEl.muted = silenciado;

        if (Hls.isSupported()) {
          hlsInstance = new Hls();
          hlsInstance.loadSource(canal.url);
          hlsInstance.attachMedia(videoEl);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {
              // Si el navegador bloquea autoplay con sonido, inicia en mute
              videoEl.muted = true;
              videoEl.play();
            });
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = canal.url;
          videoEl.play().catch(() => {});
        }
      }

      // MODO 2: PLAYLIST YOUTUBE SIMULANDO TV LINEAL
      else if (canal.tipo === "youtube") {
        videoEl.style.display = "none";
        ytWrapper.style.display = "block";

        if (ytApiLista && ytPlayer) {
          // Simula que el programa ya va empezado según la hora actual
          const ahora = new Date();
          const videoIndex = (ahora.getHours() + ahora.getMinutes()) % 12;
          const segundoInicio = ahora.getSeconds() * 5;

          ytPlayer.loadPlaylist({
            list: canal.playlistId,
            listType: "playlist",
            index: videoIndex,
            startSeconds: segundoInicio
          });

          if (silenciado) ytPlayer.mute();
          else ytPlayer.unMute();
        }
      }
    }

    // Controles de Botones
    function canalSiguiente() {
      sintonizarCanal(canalActualIdx + 1);
    }

    function canalAnterior() {
      sintonizarCanal(canalActualIdx - 1);
    }

    function toggleMute() {
      if (!tvEncendida) return;
      silenciado = !silenciado;
      videoEl.muted = silenciado;
      if (ytApiLista && ytPlayer) {
        if (silenciado) ytPlayer.mute();
        else ytPlayer.unMute();
      }
      document.getElementById("btn-mute").textContent = silenciado ? "🔇 MUDO" : "🔊 AUDIO";
      mostrarOSD();
    }

    function togglePower() {
      tvEncendida = !tvEncendida;
      const led = document.getElementById("power-led");

      if (!tvEncendida) {
        offScreen.style.display = "block";
        led.classList.add("off");
        if (hlsInstance) hlsInstance.destroy();
        videoEl.pause();
        if (ytApiLista && ytPlayer.stopVideo) ytPlayer.stopVideo();
      } else {
        offScreen.style.display = "none";
        led.classList.remove("off");
        sintonizarCanal(canalActualIdx);
      }
    }

    // Controles con teclado (Flechas Arriba/Abajo y M)
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp" || e.key === "ArrowRight") canalSiguiente();
      if (e.key === "ArrowDown" || e.key === "ArrowLeft") canalAnterior();
      if (e.key.toLowerCase() === "m") toggleMute();
    });

    // Activar audio al primer toque/clic en cualquier parte de la pantalla
    document.body.addEventListener("click", () => {
      if (!silenciado && tvEncendida) {
        videoEl.muted = false;
        if (ytApiLista && ytPlayer && ytPlayer.unMute) ytPlayer.unMute();
      }
    }, { once: true });

    // Arrancar interfaz
    renderizarGuia();
  </script>
</body>
</html>
