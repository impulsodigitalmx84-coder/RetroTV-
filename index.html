<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro TV 90</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: radial-gradient(1200px 600px at 50% -10%, #1a0b2e 0%, #070814 55%, #05050a 100%);
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .tv-wrapper {
      width: 100%;
      max-width: 880px;
      background: linear-gradient(180deg, #1b1440 0%, #14152f 55%, #0b0c22 100%);
      border: 2px solid #2a2b5e; box-shadow: 0 0 0 1px rgba(0,229,255,.25), 0 18px 45px rgba(0,0,0,.75), 0 0 40px rgba(255,46,154,.15);
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2c2c32;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
    }

    .brand-title .retro {
      font-size: 16px;
      font-weight: 800;
      color: #f4f4f6;
      letter-spacing: 1px;
    }

    .brand-title .tv90 {
      background: linear-gradient(90deg,#00c2d8,#ff2e9a);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .ch-badge-top {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: #00e5ff;
      background: #121215;
      padding: 4px 10px;
      border-radius: 7px;
      border: 1px solid #2b2b33;
    }

    .channel-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141417;
      padding: 7px 10px;
      border-radius: 9px;
      border: 1px solid #28282f;
      gap: 8px;
      flex-wrap: wrap;
    }

    .channel-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .canal-label {
      font-weight: 700;
      font-size: 13px;
      color: #fff;
    }

    .live-pill {
      background: linear-gradient(90deg,#00c2d8,#ff2e9a);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .adguard-pill {
      background: #198754;
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .program-name {
      font-size: 12px;
      color: #a0a0ab;
    }

    .screen-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      border: 2px solid #2a2a30;
    }

    video, #yt-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    video {
      object-fit: contain;
      background: #000;
    }

    #yt-box {
      display: none;
    }

    .corner-watermark {
      position: absolute;
      top: 10px;
      left: 12px;
      z-index: 8;
      pointer-events: none;
      opacity: 0.42;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
      line-height: 1.05;
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.45), 1px 1px 2px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .corner-watermark .wm-retro {
      font-size: 12px;
      font-weight: 800;
      color: #ff2e9a;
      letter-spacing: 1px;
    }

    .corner-watermark .wm-tv90 {
      font-size: 10px;
      font-weight: 800;
      color: #00e5ff;
      letter-spacing: 1px;
    }

    .channel-transition {
      position: absolute;
      inset: 0;
      z-index: 12;
      pointer-events: none;
      opacity: 0;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.14) 0px,
          rgba(255, 255, 255, 0.14) 2px,
          rgba(0, 0, 0, 0.55) 2px,
          rgba(0, 0, 0, 0.55) 4px
        ),
        radial-gradient(circle, rgba(255,255,255,0.22) 0%, rgba(10,10,14,0.92) 100%);
      transition: opacity 0.14s ease;
    }

    .channel-transition.active {
      opacity: 1;
      animation: tuneFlicker 0.36s steps(4) forwards;
    }

    @keyframes tuneFlicker {
      0% { opacity: 0.95; transform: scaleY(1.03); }
      50% { opacity: 0.7; transform: scaleY(0.98); }
      100% { opacity: 0; transform: scaleY(1); }
    }

    .power-off-layer {
      position: absolute;
      inset: 0;
      background: #050507;
      display: none;
      z-index: 15;
    }

    .progress-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #9e9ea8;
      font-family: 'Orbitron', sans-serif;
    }

    .progress-track {
      flex: 1;
      height: 5px;
      background: #2a2a32;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg,#00e5ff,#ff2e9a);
      transition: width 0.2s linear;
    }

    .btn-accent{background:linear-gradient(90deg,#00c2d8,#ff2e9a)!important;border:none!important;color:#fff!important;box-shadow:0 4px 18px rgba(255,46,154,.35)}
    .btn-primary{background:linear-gradient(90deg,#00e5ff,#7b2ff7)!important;border:none!important}
    .btn-ghost{border:1px solid #00e5ff!important;color:#00e5ff!important}
    .brand-title .retro{color:#fff;text-shadow:0 0 14px rgba(0,229,255,.6)}
    .brand-title .tv90{background:linear-gradient(90deg,#00c2d8,#ff2e9a)!important;box-shadow:0 0 14px rgba(255,46,154,.5)}
    .ch-badge-top{border-color:#00e5ff!important;color:#00e5ff!important;background:#0b0c22!important}
    .screen-container{border-color:#2a2b5e!important;box-shadow:0 0 30px rgba(0,229,255,.12) inset}
    .progress-fill{background:linear-gradient(90deg,#00e5ff,#ff2e9a)!important}
    .tools-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1 1 180px;
      background: #121215;
      border: 1px solid #32323b;
      color: #fff;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }

    .search-input:focus {
      border-color: #00e5ff;
    }

    .search-results-panel {
      background: #141417;
      border: 1px solid #2b2b33;
      border-radius: 10px;
      padding: 8px;
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 200px;
      overflow-y: auto;
    }

    .search-results-panel.open {
      display: flex;
    }

    .yt-result-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #1c1c21;
      padding: 6px 8px;
      border-radius: 7px;
      font-size: 12px;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .btn {
      background: #27272e;
      color: #f4f4f6;
      border: 1px solid #383842;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #34343e;
    }

    .btn-accent {
      background: #00b4d8;
      color: #000;
      border-color: #00b4d8;
    }

    .btn-accent:hover {
      background: #48cae4;
    }

    .btn-danger {
      background: #d62828;
      color: #fff;
      border-color: #d62828;
    }

    .channels-list {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 3px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: #141417;
      border: 1px solid #2b2b33;
      color: #d0d0d8;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }

    .channel-item.active {
      background: linear-gradient(90deg,#00e5ff,#ff2e9a);
      color: #000;
      font-weight: 700;
      border-color: #00e5ff;
    }

    .del-ch {
      background: rgba(0, 0, 0, 0.25);
      border: none;
      color: inherit;
      font-weight: bold;
      border-radius: 4px;
      padding: 0 4px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      body {
        padding: 6px;
        align-items: flex-start;
      }

      .tv-wrapper {
        padding: 10px;
        border-radius: 12px;
        gap: 8px;
      }

      .brand-title .retro {
        font-size: 13px;
      }

      .brand-title .tv90 {
        font-size: 9px;
        padding: 2px 5px;
      }

      .ch-badge-top {
        font-size: 12px;
        padding: 3px 8px;
      }

      .canal-label {
        font-size: 12px;
      }

      .program-name {
        font-size: 11px;
      }

      .btn {
        padding: 6px 8px;
        font-size: 11px;
      }

      .search-input {
        padding: 6px 8px;
        font-size: 12px;
      }
    }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 12px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, #1b1440 0%, #14152f 55%, #0b0c22 100%);
      border: 1px solid #353540;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal-card h3 {
      font-size: 15px;
      color: #00e5ff;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 12px;
      color: #bbb;
    }

    .form-group input, .form-group select {
      background: #121215;
      border: 1px solid #34343e;
      color: #fff;
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 13px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      background: linear-gradient(90deg,#00e5ff,#ff2e9a);
      color: #000;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="tv-wrapper">
    <div class="tv-header">
      <div class="brand-title">
        <span class="retro">retro</span>
        <span class="tv90">tv 90</span>
      </div>
      <div class="ch-badge-top" id="top-ch">CH 02</div>
    </div>

    <div class="channel-info-bar">
      <div class="channel-meta">
        <span class="canal-label" id="info-canal">CANAL 02</span>
        <span class="live-pill" id="info-badge">EN VIVO</span>
        <span class="adguard-pill" id="adblock-pill" onclick="toggleAutoMuteAds()" title="Escudos anti-anuncios">ESCUDOS: ON</span>
        <span class="program-name" id="info-programa">Sin Programación</span>
      </div>
    </div>

    <div class="screen-container">
      <video id="main-video" playsinline controls></video>
      <div id="yt-box"><div id="yt-player"></div></div>

      <div class="corner-watermark" aria-hidden="true">
        <span class="wm-retro">retro</span>
        <span class="wm-tv90">tv 90</span>
      </div>

      <div class="channel-transition" id="channel-transition"></div>
      <div class="power-off-layer" id="power-off"></div>
    </div>

    <div class="progress-row">
      <span id="time-current">00:00</span>
      <div class="progress-track" onclick="adelantarBarra(event)">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span id="time-total">00:00</span>
    </div>

    <div class="tools-row">
      <input
        type="text"
        id="yt-input" data-yt-api="1"
        class="search-input"
        placeholder="Pega link de video/playlist o escribe búsqueda..."
        onkeydown="if(event.key==='Enter') buscarOCargarYT()"
      >
      <button class="btn btn-accent" onclick="buscarOCargarYT()">Buscar YT</button>
      <button class="btn" onclick="configurarAPIKeyYT()">API YT</button>
      <button class="btn" onclick="document.getElementById('local-files').click()">Cargar Videos</button>
      <input type="file" id="local-files" accept="video/*" multiple style="display:none" onchange="cargarVideosLocales(event)">
    </div>

    <div class="search-results-panel" id="yt-results-panel"></div>

    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn" onclick="canalAnterior()">CH -</button>
        <button class="btn" onclick="canalSiguiente()">CH +</button>
        <button class="btn" id="btn-mute" onclick="toggleAudio()">Audio</button>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="abrirModal()">+ Canal</button>
        <button class="btn" onclick="compartirLista()">Compartir</button>
        <button class="btn btn-danger" onclick="togglePower()">Power</button>
      </div>
    </div>

    <div class="channels-list" id="channels-list"></div>
  </div>

  <div class="modal-bg" id="modal-canal">
    <div class="modal-card">
      <h3 id="modal-titulo">Agregar Canal</h3>
      <div class="form-group">
        <label>Nombre del canal</label>
        <input type="text" id="in-nombre" placeholder="Ej. TDN Deportes">
      </div>
      <div class="form-group">
        <label>Programa / Descripción</label>
        <input type="text" id="in-prog" placeholder="Ej. Deportes en Español">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="in-tipo">
          <option value="youtube_playlist">Playlist de YouTube (Link o ID)</option>
          <option value="youtube_video">Video de YouTube (Link o ID)</option>
          <option value="hls">Canal en Vivo (.m3u8)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Enlace o ID</label>
        <input type="text" id="in-valor" placeholder="Pega aquí el link de YouTube o .m3u8">
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-accent" onclick="guardarCanal()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const CANALES_DEFAULT = [
      {
        id: "ch_noticias",
        numero: "02",
        nombre: "Noticias En Vivo",
        programa: "DW Español 24/7",
        tipo: "hls",
        valor: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8",
        personalizado: true
      },
      {
        id: "ch_tdn",
        numero: "03",
        nombre: "TDN / Deportes",
        programa: "Agrega o pega enlace/playlist de deportes",
        tipo: "youtube_playlist",
        valor: "PL9352431377997654",
        personalizado: true
      }
    ];

    const LS_KEY = "retrotv90_canales_consecutivos_v1";
    const YT_API_KEY_STORAGE = "retrotv90_yt_apikey";
    const DB_NAME = "RetroTV90DB";
    const STORE_NAME = "config";

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    function reenumerarCanales(lista) {
      return lista.map((ch, idx) => ({
        ...ch,
        numero: String(idx + 2).padStart(2, "0")
      }));
    }

    async function guardarPersistente(listaCanales) {
      const ordenados = reenumerarCanales(listaCanales);
      const json = JSON.stringify(ordenados);
      try { localStorage.setItem(LS_KEY, json); } catch (e) {}
      try {
        const db = await abrirDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(json, LS_KEY);
      } catch (e) {}
      return ordenados;
    }

    async function leerPersistente() {
      const params = new URLSearchParams(window.location.search);
      if (params.get("c")) {
        try {
          const base64 = params.get("c").replace(/-/g, "+").replace(/_/g, "/");
          const decodificados = JSON.parse(decodeURIComponent(atob(base64)));
          if (Array.isArray(decodificados) && decodificados.length) {
            return await guardarPersistente(decodificados);
          }
        } catch (e) {}
      }

      try {
        const db = await abrirDB();
        const data = await new Promise((res) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const r = tx.objectStore(STORE_NAME).get(LS_KEY);
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        });
        if (data) {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed) && parsed.length) return reenumerarCanales(parsed);
        }
      } catch (e) {}

      try {
        const ls = localStorage.getItem(LS_KEY);
        if (ls) {
          const parsed = JSON.parse(ls);
          if (Array.isArray(parsed) && parsed.length) return reenumerarCanales(parsed);
        }
      } catch (e) {}

      return reenumerarCanales([...CANALES_DEFAULT]);
    }

    let canales = [];
    let indiceActual = 0;
    let encendida = true;
    let silenciado = false;
    let escudosActivos = true;
    let hls = null;
    let ytPlayer = null;
    let ytListo = false;
    let archivosLocales = [];
    let indiceLocal = 0;

    const videoEl = document.getElementById("main-video");
    const ytBox = document.getElementById("yt-box");
    const powerOffEl = document.getElementById("power-off");
    const transitionEl = document.getElementById("channel-transition");
    const ytResultsPanel = document.getElementById("yt-results-panel");

    function dispararTransicionCanal() {
      transitionEl.classList.remove("active");
      void transitionEl.offsetWidth;
      transitionEl.classList.add("active");
    }

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2600);
    }

    function toggleAutoMuteAds() {
      escudosActivos = !escudosActivos;
      const pill = document.getElementById("adblock-pill");
      pill.textContent = escudosActivos ? "ESCUDOS: ON" : "ESCUDOS: OFF";
      pill.style.background = escudosActivos ? "#198754" : "#555";
      toast(escudosActivos ? "Escudos anti-anuncios activos" : "Escudos desactivados");
    }

    function formatearTiempo(seg) {
      if (!isFinite(seg) || seg < 0) return "00:00";
      const m = Math.floor(seg / 60);
      const s = Math.floor(seg % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    setInterval(() => {
      if (!encendida) return;
      if (videoEl.style.display !== "none" && videoEl.duration) {
        document.getElementById("time-current").textContent = formatearTiempo(videoEl.currentTime);
        document.getElementById("time-total").textContent = formatearTiempo(videoEl.duration);
        document.getElementById("progress-fill").style.width = `${(videoEl.currentTime / videoEl.duration) * 100}%`;
      } else if (ytListo && ytPlayer && ytPlayer.getCurrentTime && ytBox.style.display !== "none") {
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        if (dur > 0) {
          document.getElementById("time-current").textContent = formatearTiempo(cur);
          document.getElementById("time-total").textContent = formatearTiempo(dur);
          document.getElementById("progress-fill").style.width = `${(cur / dur) * 100}%`;
        }
      }
    }, 500);

    function adelantarBarra(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (videoEl.style.display !== "none" && videoEl.duration) {
        videoEl.currentTime = pct * videoEl.duration;
      } else if (ytListo && ytPlayer && ytPlayer.getDuration) {
        const dur = ytPlayer.getDuration();
        if (dur) ytPlayer.seekTo(pct * dur, true);
      }
    }

    function extraerVideoID(txt) {
      const s = txt.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const m = s.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function extraerPlaylistID(txt) {
      const s = txt.trim();
      if (/^(PL|UU|FL|OL|RD)[a-zA-Z0-9_-]+$/.test(s)) return s;
      const m = s.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function renderizarCanales() {
      const cont = document.getElementById("channels-list");
      cont.innerHTML = "";
      canales.forEach((ch, idx) => {
        const item = document.createElement("div");
        item.className = "channel-item" + (idx === indiceActual ? " active" : "");
        item.onclick = () => sintonizar(idx);

        const span = document.createElement("span");
        span.textContent = `CH ${ch.numero} · ${ch.nombre}`;
        item.appendChild(span);

        if (canales.length > 1) {
          const del = document.createElement("button");
          del.className = "del-ch";
          del.textContent = "×";
          del.title = "Eliminar canal";
          del.onclick = async (ev) => {
            ev.stopPropagation();
            canales.splice(idx, 1);
            canales = await guardarPersistente(canales);
            if (indiceActual >= canales.length) indiceActual = 0;
            renderizarCanales();
            sintonizar(indiceActual);
            toast("Canal eliminado");
          };
          item.appendChild(del);
        }

        cont.appendChild(item);
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          hl: "es",
          playsinline: 1
        },
        events: {
          onReady: () => {
            ytListo = true;
            if (canales.length) sintonizar(indiceActual);
          },
          onStateChange: (ev) => {
            if (escudosActivos && !silenciado && ev.data === YT.PlayerState.PLAYING) {
              try { ytPlayer.unMute(); } catch (e) {}
            }
          }
        }
      });
    };

    function limpiarReproductores() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoEl.pause();
      videoEl.removeAttribute("src");
      if (ytListo && ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      document.getElementById("time-current").textContent = "00:00";
      document.getElementById("time-total").textContent = "00:00";
      document.getElementById("progress-fill").style.width = "0%";
    }

    function sintonizar(idx) {
      if (!encendida || !canales.length) return;
      if (idx < 0) idx = canales.length - 1;
      if (idx >= canales.length) idx = 0;
      indiceActual = idx;

      const ch = canales[indiceActual];
      renderizarCanales();
      dispararTransicionCanal();
      limpiarReproductores();

      document.getElementById("top-ch").textContent = `CH ${ch.numero}`;
      document.getElementById("info-canal").textContent = `CANAL ${ch.numero} · ${ch.nombre}`;
      document.getElementById("info-programa").textContent = ch.programa || "En transmisión";
      document.getElementById("info-badge").textContent = ch.tipo === "local" ? "LOCAL" : "EN VIVO";

      if (ch.tipo === "hls") {
        ytBox.style.display = "none";
        videoEl.style.display = "block";
        videoEl.muted = silenciado;

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(ch.valor);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = ch.valor;
          videoEl.play().catch(() => {});
        }
      } else if (ch.tipo === "youtube_playlist") {
        const pid = extraerPlaylistID(ch.valor) || ch.valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";

        if (ytListo && ytPlayer) {
          ytPlayer.loadPlaylist({ list: pid, listType: "playlist", index: 0 });
          if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      } else if (ch.tipo === "youtube_video") {
        const vid = extraerVideoID(ch.valor) || ch.valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";

        if (ytListo && ytPlayer) {
          ytPlayer.loadVideoById(vid);
          if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      } else if (ch.tipo === "local") {
        ytBox.style.display = "none";
        videoEl.style.display = "block";
        videoEl.muted = silenciado;
        reproducirArchivoLocal(0);
      }
    }

    function cargarVideosLocales(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      archivosLocales = files.map(f => ({
        nombre: f.name,
        url: URL.createObjectURL(f)
      }));

      let idxLocalCh = canales.findIndex(c => c.tipo === "local");
      if (idxLocalCh === -1) {
        canales.push({
          id: "ch_local_" + Date.now(),
          numero: String(canales.length + 2).padStart(2, "0"),
          nombre: "Videos del Dispositivo",
          programa: archivosLocales[0].nombre,
          tipo: "local",
          valor: ""
        });
        canales = reenumerarCanales(canales);
        idxLocalCh = canales.length - 1;
      }

      sintonizar(idxLocalCh);
      toast(`${files.length} video(s) cargados`);
    }

    function reproducirArchivoLocal(i) {
      if (!archivosLocales.length) return;
      if (i >= archivosLocales.length) i = 0;
      indiceLocal = i;
      const archivo = archivosLocales[indiceLocal];
      document.getElementById("info-programa").textContent = `${archivo.nombre} (${indiceLocal + 1}/${archivosLocales.length})`;
      videoEl.src = archivo.url;
      videoEl.play().catch(() => {});
      videoEl.onended = () => reproducirArchivoLocal(indiceLocal + 1);
    }

    function configurarAPIKeyYT() {
      const actual = localStorage.getItem(YT_API_KEY_STORAGE) || "";
      const nueva = prompt("Pega tu YouTube Data API v3 Key (opcional para búsqueda en lista):", actual);
      if (nueva !== null) {
        localStorage.setItem(YT_API_KEY_STORAGE, nueva.trim());
        toast("API Key actualizada");
      }
    }

    function cargarVideoDirectoYT(vid, titulo = "VIDEO DE YOUTUBE") {
      dispararTransicionCanal();
      limpiarReproductores();
      videoEl.style.display = "none";
      ytBox.style.display = "block";
      document.getElementById("info-canal").textContent = "YOUTUBE";
      document.getElementById("info-programa").textContent = titulo;
      if (ytListo && ytPlayer) {
        ytPlayer.loadVideoById(vid);
        if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
      }
    }

    async function buscarOCargarYT() {
      const q = document.getElementById("yt-input").value.trim();
      if (!q) return;

      const pid = extraerPlaylistID(q);
      const vid = extraerVideoID(q);

      if (pid) {
        ytResultsPanel.classList.remove("open");
        dispararTransicionCanal();
        limpiarReproductores();
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        document.getElementById("info-canal").textContent = "YOUTUBE PLAYLIST";
        document.getElementById("info-programa").textContent = `Lista: ${pid}`;
        if (ytListo) ytPlayer.loadPlaylist({ list: pid, listType: "playlist", index: 0 });
        return;
      }

      if (vid) {
        ytResultsPanel.classList.remove("open");
        cargarVideoDirectoYT(vid, `Video ID: ${vid}`);
        return;
      }

      const apiKey = localStorage.getItem(YT_API_KEY_STORAGE);
      if (apiKey) {
        try {
          const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=8&q=${encodeURIComponent(q)}&key=${encodeURIComponent(apiKey)}`;
          const res = await fetch(url);
          const data = await res.json();
          if (data.error) { toast("API Key inválida o sin cuota. Revisa tu key."); return; }
          if (data.items && data.items.length) {
            ytResultsPanel.innerHTML = "";
            data.items.forEach(item => {
              const row = document.createElement("div");
              row.className = "yt-result-row";
              const titleSpan = document.createElement("span");
              titleSpan.textContent = item.snippet.title;
              const playBtn = document.createElement("button");
              playBtn.className = "btn btn-accent";
              playBtn.textContent = "Ver aquí";
              playBtn.onclick = () => {
                ytResultsPanel.classList.remove("open");
                cargarVideoDirectoYT(item.id.videoId, item.snippet.title);
              };
              row.appendChild(titleSpan);
              row.appendChild(playBtn);
              ytResultsPanel.appendChild(row);
            });
            ytResultsPanel.classList.add("open");
            return;
          }
        } catch (e) {}
      }

      // Sin API Key: NO abrir YouTube externo. Mostrar ayuda dentro de la app.
      ytResultsPanel.innerHTML = "";
      const help = document.createElement("div");
      help.className = "yt-result-row";
      help.innerHTML = "<span>Para buscar por nombre necesitas tu YouTube API Key. O pega el link directo del video / playlist y se verá aquí dentro.</span>";
      const cfgBtn = document.createElement("button");
      cfgBtn.className = "btn btn-accent";
      cfgBtn.textContent = "Poner API Key";
      cfgBtn.onclick = () => { pedirAPIKeyYT(); ytResultsPanel.classList.remove("open"); };
      help.appendChild(cfgBtn);
      ytResultsPanel.appendChild(help);
      ytResultsPanel.classList.add("open");
      toast("Pega el link directo o pon tu API Key");
    }

    function abrirModal() {
      const siguienteNum = String(canales.length + 2).padStart(2, "0");
      document.getElementById("modal-titulo").textContent = `Agregar Canal (CH ${siguienteNum})`;
      document.getElementById("modal-canal").classList.add("open");
    }

    function cerrarModal() {
      document.getElementById("modal-canal").classList.remove("open");
    }

    async function guardarCanal() {
      const nombre = document.getElementById("in-nombre").value.trim();
      const programa = document.getElementById("in-prog").value.trim() || "Programación en Español";
      const tipo = document.getElementById("in-tipo").value;
      const valor = document.getElementById("in-valor").value.trim();

      if (!nombre || !valor) {
        toast("Escribe el nombre y pega el enlace");
        return;
      }

      canales.push({
        id: "ch_" + Date.now(),
        numero: "00",
        nombre,
        programa,
        tipo,
        valor,
        personalizado: true
      });

      canales = await guardarPersistente(canales);
      document.getElementById("in-nombre").value = "";
      document.getElementById("in-prog").value = "";
      document.getElementById("in-valor").value = "";
      cerrarModal();
      renderizarCanales();
      sintonizar(canales.length - 1);
      toast(`Guardado como CH ${canales[canales.length - 1].numero}`);
    }

    function canalSiguiente() { sintonizar(indiceActual + 1); }
    function canalAnterior() { sintonizar(indiceActual - 1); }

    function toggleAudio() {
      silenciado = !silenciado;
      videoEl.muted = silenciado;
      if (ytListo && ytPlayer) {
        if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
      }
      document.getElementById("btn-mute").textContent = silenciado ? "Silenciado" : "Audio";
    }

    function togglePower() {
      encendida = !encendida;
      if (!encendida) {
        powerOffEl.style.display = "block";
        limpiarReproductores();
      } else {
        powerOffEl.style.display = "none";
        dispararTransicionCanal();
        sintonizar(indiceActual);
      }
    }

    async function compartirLista() {
      const canalesSinLocal = canales.filter(c => c.tipo !== "local");
      const b64 = btoa(encodeURIComponent(JSON.stringify(canalesSinLocal)))
        .replace(/\+/g, "-")
        .replace(/\//g, "_")
        .replace(/=+$/, "");
      const urlCompartible = `${window.location.origin}${window.location.pathname}?c=${b64}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Retro TV 90 - Playlist",
            text: "Abre este enlace en cualquier dispositivo para cargar mis canales",
            url: urlCompartible
          });
          return;
        } catch (e) {}
      }

      try {
        await navigator.clipboard.writeText(urlCompartible);
        toast("Enlace de playlist copiado");
      } catch (e) {
        prompt("Copia este enlace para abrirlo en otro dispositivo:", urlCompartible);
      }
    }

    (async function init() {
      canales = await leerPersistente();
      renderizarCanales();
      if (ytListo) sintonizar(0);
    })();
  </script>
</body>
</html>
