<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro TV 90</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #141414;
      color: #f3f3f3;
      font-family: 'VT323', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 10px;
      gap: 8px;
      overflow-x: hidden;
    }

    .app-stage {
      width: 100%;
      max-width: 960px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      transition: transform 0.25s ease;
    }

    .top-bar {
      width: 100%;
      background: #22211f;
      border: 2px solid #3a3835;
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .search-box {
      display: flex;
      flex: 1 1 280px;
      gap: 6px;
    }

    .search-input {
      flex: 1;
      background: #111;
      border: 2px solid #444;
      color: #39ff14;
      font-family: 'VT323', monospace;
      font-size: 19px;
      padding: 5px 10px;
      border-radius: 7px;
      outline: none;
    }

    .search-input:focus {
      border-color: #39ff14;
    }

    .action-btn {
      background: linear-gradient(180deg, #4b4946, #2d2c2a);
      color: #fff;
      border: 2px solid #161616;
      border-bottom: 3px solid #111;
      border-radius: 7px;
      padding: 6px 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
      white-space: nowrap;
    }

    .action-btn:active {
      transform: translateY(2px);
    }

    .btn-green {
      background: linear-gradient(180deg, #2b9348, #1b6630);
    }

    .btn-blue {
      background: linear-gradient(180deg, #2563eb, #1d4ed8);
    }

    .tv-casing {
      width: 100%;
      background: linear-gradient(145deg, #3c3a37, #242321);
      border: 4px solid #181817;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .screen-bezel {
      background: #0c0c0c;
      border: 3px solid #2c2a28;
      border-radius: 14px;
      padding: 8px;
    }

    .crt-screen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 54vh;
      background: #050505;
      border-radius: 10px;
      overflow: hidden;
    }

    video, #yt-player-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }

    video {
      object-fit: cover;
    }

    #yt-player-box {
      display: none;
    }

    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 6;
    }

    .osd {
      position: absolute;
      top: 12px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 8;
      pointer-events: none;
      text-shadow: 2px 2px 0 #000;
      transition: opacity 0.4s;
    }

    .osd.hidden {
      opacity: 0;
    }

    .osd-ch {
      font-family: 'Press Start 2P', monospace;
      font-size: 16px;
      color: #39ff14;
      margin-bottom: 3px;
    }

    .osd-title {
      font-size: 20px;
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 7px;
      border-left: 3px solid #39ff14;
    }

    .osd-sub {
      font-size: 16px;
      color: #ffea00;
      background: rgba(0, 0, 0, 0.65);
      padding: 2px 7px;
      margin-top: 2px;
    }

    .osd-live {
      background: #c1121f;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 5px 7px;
      border-radius: 4px;
    }

    .static-overlay {
      position: absolute;
      inset: 0;
      background: #141414 repeating-radial-gradient(#444 0 1px, transparent 1px 4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 7;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #fff;
    }

    .static-overlay.active {
      display: flex;
    }

    .off-overlay {
      position: absolute;
      inset: 0;
      background: #040404;
      display: none;
      z-index: 12;
    }

    .channels-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 3px;
      align-items: center;
    }

    .ch-pill {
      background: #2c2a28;
      color: #ddd;
      border: 1px solid #484542;
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 17px;
      cursor: pointer;
      white-space: nowrap;
    }

    .ch-pill.active {
      background: #39ff14;
      color: #000;
      font-weight: bold;
      border-color: #39ff14;
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #1e1d1b;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #33312e;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .led {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #39ff14;
      box-shadow: 0 0 8px #39ff14;
    }

    .led.off {
      background: #550000;
      box-shadow: none;
    }

    .brand-text {
      font-family: 'Press Start 2P', monospace;
      font-size: 13px;
    }

    .brand-90 {
      background: #ff5400;
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      padding: 4px 6px;
      border-radius: 4px;
    }

    .btns {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tv-btn {
      background: linear-gradient(180deg, #4a4845, #2e2d2b);
      color: #fff;
      border: 2px solid #151515;
      border-bottom: 3px solid #111;
      border-radius: 7px;
      padding: 7px 10px;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      cursor: pointer;
    }

    .tv-btn:active {
      transform: translateY(2px);
    }

    .tv-btn.power {
      background: linear-gradient(180deg, #c1121f, #780000);
    }

    .search-results {
      width: 100%;
      background: #1c1b19;
      border: 2px solid #353330;
      border-radius: 10px;
      padding: 8px 12px;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    .search-results.show {
      display: flex;
    }

    .result-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      background: #272523;
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 18px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 14px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      width: 100%;
      max-width: 450px;
      background: #242321;
      border: 3px solid #444;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .modal h3 {
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      color: #39ff14;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 18px;
      color: #ddd;
    }

    .field input, .field select {
      background: #121212;
      border: 2px solid #444;
      color: #fff;
      font-family: 'VT323', monospace;
      font-size: 18px;
      padding: 6px 10px;
      border-radius: 7px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 4px;
    }

    .toast {
      position: fixed;
      bottom: 14px;
      right: 14px;
      background: #39ff14;
      color: #000;
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      padding: 9px 12px;
      border-radius: 7px;
      z-index: 100;
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-stage" id="app-stage">
    <div class="top-bar">
      <div class="search-box">
        <input
          type="text"
          id="yt-search-input"
          class="search-input"
          placeholder="Buscar o pegar link/ID de YouTube..."
          oninput="filtrarCatalogo()"
          onkeydown="if(event.key==='Enter') ejecutarBusquedaYouTube()"
        >
        <button class="action-btn btn-green" onclick="ejecutarBusquedaYouTube()">CARGAR</button>
      </div>
      <button class="action-btn" onclick="abrirModalCanal()">+ CANAL</button>
      <button class="action-btn btn-blue" onclick="compartirActual()">COMPARTIR</button>
      <button class="action-btn" onclick="rotarPantalla()">GIRAR 90°</button>
    </div>

    <div class="search-results" id="search-results"></div>

    <div class="tv-casing">
      <div class="screen-bezel">
        <div class="crt-screen">
          <video id="video-player" playsinline controls></video>
          <div id="yt-player-box"><div id="yt-player"></div></div>

          <div class="static-overlay" id="static-overlay">SINTONIZANDO...</div>
          <div class="off-overlay" id="off-overlay"></div>

          <div class="osd" id="osd">
            <div>
              <div class="osd-ch" id="osd-ch">CH 02</div>
              <div class="osd-title" id="osd-title">CARICATURAS RETRO</div>
              <div class="osd-sub" id="osd-sub">Listo para reproducir</div>
            </div>
            <div class="osd-live">EN VIVO</div>
          </div>

          <div class="scanlines"></div>
        </div>
      </div>

      <div class="channels-bar" id="channels-bar"></div>

      <div class="controls-row">
        <div class="brand">
          <div class="led" id="led"></div>
          <span class="brand-text">RETRO</span>
          <span class="brand-90">TV 90</span>
        </div>

        <div class="btns">
          <button class="tv-btn" onclick="canalAnterior()">CH -</button>
          <button class="tv-btn" onclick="canalSiguiente()">CH +</button>
          <button class="tv-btn" id="btn-audio" onclick="toggleMute()">AUDIO</button>
          <button class="tv-btn" onclick="mostrarOSD()">INFO</button>
          <button class="tv-btn power" onclick="togglePower()">POWER</button>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modal-canal">
    <div class="modal">
      <h3>AGREGAR NUEVO CANAL</h3>
      <div class="field">
        <label>Nombre del canal</label>
        <input type="text" id="new-ch-name" placeholder="Ej. CANAL 09 - DRAGON BALL">
      </div>
      <div class="field">
        <label>Programa / Descripción</label>
        <input type="text" id="new-ch-prog" placeholder="Ej. Episodios Clásicos">
      </div>
      <div class="field">
        <label>Tipo de transmisión</label>
        <select id="new-ch-type">
          <option value="youtube_video">YouTube Video (Link o ID)</option>
          <option value="youtube_playlist">YouTube Playlist (Link o ID)</option>
          <option value="hls">Stream en vivo (.m3u8)</option>
        </select>
      </div>
      <div class="field">
        <label>Link o ID del video / playlist / .m3u8</label>
        <input type="text" id="new-ch-url" placeholder="Pega URL de YouTube, ID o enlace .m3u8">
      </div>
      <div class="modal-actions">
        <button class="action-btn" onclick="cerrarModalCanal()">CANCELAR</button>
        <button class="action-btn btn-green" onclick="guardarNuevoCanal()">GUARDAR CANAL</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const STORAGE_KEY = "retrotv90_canales_v1";

    const CANALES_BASE = [
      {
        numero: "02",
        nombre: "CANAL 02 - CARICATURAS RETRO",
        programa: "Clásicos Animados",
        tipo: "youtube_playlist",
        valor: "PL7XlqX4npddfrdpMCxBnNZXg2GFll7t5y"
      },
      {
        numero: "03",
        nombre: "CANAL 03 - ANIME CLÁSICO",
        programa: "Retro Anime",
        tipo: "youtube_playlist",
        valor: "PLxSscENEp7Jis5543635_7X1w1216337_"
      },
      {
        numero: "04",
        nombre: "CANAL 04 - LUCHA LIBRE",
        programa: "Funciones y Combates",
        tipo: "youtube_playlist",
        valor: "PL9352431377997654"
      },
      {
        numero: "05",
        nombre: "CANAL 05 - DEPORTES",
        programa: "Red Bull TV En Vivo",
        tipo: "hls",
        valor: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8"
      },
      {
        numero: "06",
        nombre: "CANAL 06 - PELÍCULAS",
        programa: "Cine Clásico",
        tipo: "youtube_playlist",
        valor: "PL3002579207484830"
      },
      {
        numero: "07",
        nombre: "CANAL 07 - SERIES",
        programa: "Series Retro",
        tipo: "youtube_playlist",
        valor: "PL5323338982834221"
      }
    ];

    const CATALOGO_RAPIDO = [
      { titulo: "Caricaturas Retro - Maratón Clásicos", tipo: "youtube_playlist", valor: "PL7XlqX4npddfrdpMCxBnNZXg2GFll7t5y" },
      { titulo: "Anime Clásico - Episodios", tipo: "youtube_playlist", valor: "PLxSscENEp7Jis5543635_7X1w1216337_" },
      { titulo: "Lucha Libre - Funciones Estelares", tipo: "youtube_playlist", valor: "PL9352431377997654" },
      { titulo: "Deportes En Vivo (Red Bull TV HLS)", tipo: "hls", valor: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8" },
      { titulo: "Películas Clásicas", tipo: "youtube_playlist", valor: "PL3002579207484830" },
      { titulo: "Series Clásicas", tipo: "youtube_playlist", valor: "PL5323338982834221" }
    ];

    function cargarCanales() {
      try {
        const guardados = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (Array.isArray(guardados) && guardados.length > 0) return guardados;
      } catch (e) {}
      return [...CANALES_BASE];
    }

    function guardarCanalesStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(canales));
    }

    let canales = cargarCanales();
    let idxActual = 0;
    let encendida = true;
    let muteado = false;
    let rotacionGrados = 0;
    let hls = null;
    let ytPlayer = null;
    let ytReady = false;
    let osdTimer = null;
    let itemActualCompartible = { titulo: "", url: "" };

    const appStage = document.getElementById("app-stage");
    const videoEl = document.getElementById("video-player");
    const ytBox = document.getElementById("yt-player-box");
    const staticEl = document.getElementById("static-overlay");
    const offEl = document.getElementById("off-overlay");
    const osdEl = document.getElementById("osd");
    const barEl = document.getElementById("channels-bar");
    const resultsEl = document.getElementById("search-results");

    function mostrarToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 2600);
    }

    function rotarPantalla() {
      rotacionGrados = (rotacionGrados + 90) % 360;
      appStage.style.transform = `rotate(${rotacionGrados}deg)`;
      mostrarToast(`Rotación: ${rotacionGrados}°`);
    }

    function mostrarOSD() {
      if (!encendida) return;
      osdEl.classList.remove("hidden");
      clearTimeout(osdTimer);
      osdTimer = setTimeout(() => osdEl.classList.add("hidden"), 4000);
    }

    function extraerYouTubeID(input) {
      const s = input.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const m1 = s.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
      if (m1) return m1[1];
      const m2 = s.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
      if (m2) return m2[1];
      const m3 = s.match(/embed\/([a-zA-Z0-9_-]{11})/);
      if (m3) return m3[1];
      return null;
    }

    function extraerPlaylistID(input) {
      const s = input.trim();
      if (/^(PL|UU|FL|OL|RD)[a-zA-Z0-9_-]+$/.test(s)) return s;
      const m = s.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function renderCanalesBar() {
      barEl.innerHTML = "";
      canales.forEach((ch, i) => {
        const btn = document.createElement("button");
        btn.className = "ch-pill" + (i === idxActual ? " active" : "");
        btn.textContent = `CH ${ch.numero} · ${ch.nombre.replace(/^CANAL\s*\d+\s*-\s*/i, "")}`;
        btn.onclick = () => sintonizar(i);
        barEl.appendChild(btn);
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          playsinline: 1
        },
        events: {
          onReady: () => {
            ytReady = true;
            reproducirDesdeHashSiExiste() || sintonizar(0);
          }
        }
      });
    };

    function detenerTodo() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoEl.pause();
      videoEl.removeAttribute("src");
      if (ytReady && ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
    }

    function reproducirFuente({ numero = "YT", titulo, subtitulo, tipo, valor }) {
      if (!encendida) return;
      detenerTodo();

      staticEl.classList.add("active");
      setTimeout(() => staticEl.classList.remove("active"), 350);

      document.getElementById("osd-ch").textContent = `CH ${numero}`;
      document.getElementById("osd-title").textContent = titulo;
      document.getElementById("osd-sub").textContent = subtitulo || "";
      mostrarOSD();

      if (tipo === "hls") {
        ytBox.style.display = "none";
        videoEl.style.display = "block";
        videoEl.muted = muteado;

        itemActualCompartible = { titulo, url: valor };

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(valor);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            videoEl.play().catch(() => {});
          });
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = valor;
          videoEl.play().catch(() => {});
        }
      } else if (tipo === "youtube_video") {
        const vid = extraerYouTubeID(valor) || valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        itemActualCompartible = {
          titulo,
          url: `https://www.youtube.com/watch?v=${vid}`
        };
        if (ytReady && ytPlayer) {
          ytPlayer.loadVideoById(vid);
          if (muteado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      } else if (tipo === "youtube_playlist") {
        const pid = extraerPlaylistID(valor) || valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        itemActualCompartible = {
          titulo,
          url: `https://www.youtube.com/playlist?list=${pid}`
        };
        if (ytReady && ytPlayer) {
          ytPlayer.loadPlaylist({ list: pid, listType: "playlist", index: 0 });
          if (muteado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      }
    }

    function sintonizar(i) {
      if (i < 0) i = canales.length - 1;
      if (i >= canales.length) i = 0;
      idxActual = i;
      renderCanalesBar();
      const ch = canales[idxActual];
      reproducirFuente({
        numero: ch.numero,
        titulo: ch.nombre,
        subtitulo: ch.programa,
        tipo: ch.tipo,
        valor: ch.valor
      });
    }

    function canalSiguiente() { sintonizar(idxActual + 1); }
    function canalAnterior() { sintonizar(idxActual - 1); }

    function toggleMute() {
      muteado = !muteado;
      videoEl.muted = muteado;
      if (ytReady && ytPlayer) {
        if (muteado) ytPlayer.mute(); else ytPlayer.unMute();
      }
      document.getElementById("btn-audio").textContent = muteado ? "MUDO" : "AUDIO";
    }

    function togglePower() {
      encendida = !encendida;
      const led = document.getElementById("led");
      if (!encendida) {
        offEl.style.display = "block";
        led.classList.add("off");
        detenerTodo();
      } else {
        offEl.style.display = "none";
        led.classList.remove("off");
        sintonizar(idxActual);
      }
    }

    function filtrarCatalogo() {
      const q = document.getElementById("yt-search-input").value.trim().toLowerCase();
      if (!q) {
        resultsEl.classList.remove("show");
        return;
      }
      const matches = CATALOGO_RAPIDO.filter(item => item.titulo.toLowerCase().includes(q));
      resultsEl.innerHTML = "";

      if (extraerYouTubeID(q) || extraerPlaylistID(q)) {
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `<span>Enlace / ID de YouTube detectado: <b>${q}</b></span>`;
        const btn = document.createElement("button");
        btn.className = "action-btn btn-green";
        btn.textContent = "REPRODUCIR";
        btn.onclick = () => ejecutarBusquedaYouTube();
        div.appendChild(btn);
        resultsEl.appendChild(div);
      }

      matches.forEach(m => {
        const div = document.createElement("div");
        div.className = "result-item";
        div.innerHTML = `<span>${m.titulo}</span>`;
        const btn = document.createElement("button");
        btn.className = "action-btn btn-green";
        btn.textContent = "VER";
        btn.onclick = () => {
          resultsEl.classList.remove("show");
          reproducirFuente({
            numero: "BUSQ",
            titulo: m.titulo,
            subtitulo: "Reproducción desde buscador",
            tipo: m.tipo,
            valor: m.valor
          });
        };
        div.appendChild(btn);
        resultsEl.appendChild(div);
      });

      if (resultsEl.children.length > 0) resultsEl.classList.add("show");
      else resultsEl.classList.remove("show");
    }

    function ejecutarBusquedaYouTube() {
      const raw = document.getElementById("yt-search-input").value.trim();
      if (!raw) return;

      const vid = extraerYouTubeID(raw);
      const pid = extraerPlaylistID(raw);

      resultsEl.classList.remove("show");

      if (vid) {
        reproducirFuente({
          numero: "YT",
          titulo: "VIDEO DE YOUTUBE",
          subtitulo: `ID: ${vid}`,
          tipo: "youtube_video",
          valor: vid
        });
      } else if (pid) {
        reproducirFuente({
          numero: "LIST",
          titulo: "PLAYLIST DE YOUTUBE",
          subtitulo: `Lista: ${pid}`,
          tipo: "youtube_playlist",
          valor: pid
        });
      } else {
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(raw)}`, "_blank");
        mostrarToast("Abierto en YouTube");
      }
    }

    async function compartirActual() {
      const shareUrl = itemActualCompartible.url || window.location.href;
      const shareTitle = itemActualCompartible.titulo || "Retro TV 90";

      if (navigator.share) {
        try {
          await navigator.share({ title: shareTitle, text: `Mira ${shareTitle} en Retro TV 90`, url: shareUrl });
          return;
        } catch (e) {}
      }

      try {
        await navigator.clipboard.writeText(shareUrl);
        mostrarToast("Enlace copiado al portapapeles");
      } catch (e) {
        prompt("Copia este enlace:", shareUrl);
      }
    }

    function abrirModalCanal() {
      document.getElementById("modal-canal").classList.add("open");
    }

    function cerrarModalCanal() {
      document.getElementById("modal-canal").classList.remove("open");
    }

    function guardarNuevoCanal() {
      const nombre = document.getElementById("new-ch-name").value.trim();
      const programa = document.getElementById("new-ch-prog").value.trim() || "Programación Personalizada";
      const tipo = document.getElementById("new-ch-type").value;
      const valor = document.getElementById("new-ch-url").value.trim();

      if (!nombre || !valor) {
        mostrarToast("Completa nombre y enlace/ID");
        return;
      }

      const num = String(canales.length + 2).padStart(2, "0");
      canales.push({
        numero: num,
        nombre: nombre.toUpperCase(),
        programa,
        tipo,
        valor
      });

      guardarCanalesStorage();
      renderCanalesBar();
      cerrarModalCanal();
      document.getElementById("new-ch-name").value = "";
      document.getElementById("new-ch-prog").value = "";
      document.getElementById("new-ch-url").value = "";
      sintonizar(canales.length - 1);
      mostrarToast("Canal agregado");
    }

    function reproducirDesdeHashSiExiste() {
      const params = new URLSearchParams(window.location.search);
      const v = params.get("v");
      const list = params.get("list");
      if (v) {
        reproducirFuente({ numero: "YT", titulo: "VIDEO COMPARTIDO", subtitulo: "", tipo: "youtube_video", valor: v });
        return true;
      }
      if (list) {
        reproducirFuente({ numero: "LIST", titulo: "PLAYLIST COMPARTIDA", subtitulo: "", tipo: "youtube_playlist", valor: list });
        return true;
      }
      return false;
    }

    renderCanalesBar();
  </script>
</body>
</html>
