<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro TV 90s</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: monospace, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 10px;
    }

    /* CONTENEDOR PRINCIPAL DEL TELEVISOR */
    .tv-container {
      width: 100%;
      max-width: 600px;
      border-radius: 20px;
      padding: 20px;
      transition: all 0.3s ease;
    }

    /* 6 ESTILOS DE MARCO DE TV */
    .tv-madera       { background: #5a2a18; border: 8px solid #3b190e; }
    .tv-neon         { background: #110022; border: 8px solid #ff007f; box-shadow: 0 0 15px #ff007f; }
    .tv-transparente { background: rgba(120, 0, 180, 0.4); border: 8px solid rgba(255, 255, 255, 0.3); }
    .tv-gris         { background: #3a3a3a; border: 8px solid #222; }
    .tv-rojo         { background: #a81c1c; border: 8px solid #6b0f0f; }
    .tv-portatil     { background: #2b3a42; border: 8px solid #141d22; }

    /* PANTALLA CON EFECTO CRT Y CURVATURA */
    .pantalla-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      background: #000;
      border-radius: 25px;
      overflow: hidden;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9), 0 0 10px rgba(0,0,0,0.5);
      border: 4px solid #1a1a1a;
    }

    .pantalla-wrapper::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.04));
      background-size: 100% 3px, 6px 100%;
      pointer-events: none;
      z-index: 2;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.1s ease;
    }

    /* CONTROLES Y BOTONES */
    .panel-controles {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .btn-control {
      background: #222;
      color: #fff;
      border: 2px solid #444;
      padding: 10px 5px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .btn-control:active {
      transform: scale(0.95);
      background: #444;
    }

    .btn-guia   { background: #b8860b; border-color: #d4af37; }
    .btn-anadir { background: #006400; border-color: #2e8b57; }
    .btn-full   { background: #00008b; border-color: #4169e1; }
    .btn-power  { background: #8b0000; border-color: #dc143c; }

    /* CONTROLES EXTRAS (ESTILOS Y SINTONIZADOR) */
    .extras-container {
      margin-top: 15px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 10px;
    }

    .sintonizador-box, .estilo-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.85rem;
    }

    input[type="range"] {
      flex: 1;
      accent-color: #ff007f;
    }

    select {
      background: #222;
      color: #fff;
      border: 1px solid #555;
      padding: 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <!-- MARCO DEL TELEVISOR -->
  <div id="marco-tv" class="tv-container tv-madera">
    
    <!-- PANTALLA CRT -->
    <div class="pantalla-wrapper">
      <video id="reproductor" autoplay loop muted playsinline></video>
    </div>

    <!-- PANEL DE BOTONES -->
    <div class="panel-controles">
      <button class="btn-control" onclick="cambiarCanal(1)"><i class="fas fa-chevron-up"></i> CH +</button>
      <button class="btn-control" onclick="cambiarCanal(-1)"><i class="fas fa-chevron-down"></i> CH -</button>
      <button class="btn-control" onclick="ajustarVolumen(0.1)"><i class="fas fa-volume-up"></i> VOL +</button>
      <button class="btn-control" onclick="ajustarVolumen(-0.1)"><i class="fas fa-volume-down"></i> VOL -</button>
      
      <button class="btn-control btn-guia" onclick="abrirGuia()"><i class="fas fa-list"></i> GUÍA</button>
      <button class="btn-control btn-anadir" onclick="agregarCanal()"><i class="fas fa-folder-plus"></i> AÑADIR</button>
      <button class="btn-control btn-full" onclick="pantallaCompleta()"><i class="fas fa-expand"></i> FULL</button>
      <button class="btn-control btn-power" onclick="togglePower()"><i class="fas fa-power-off"></i> POWER</button>
    </div>

    <!-- EXTRAS: SINTONIZADOR Y MODELO DE TV -->
    <div class="extras-container">
      <div class="sintonizador-box">
        <label for="sintonizador"><i class="fas fa-sliders-h"></i> Sintonizar:</label>
        <input type="range" id="sintonizador" min="20" max="100" value="100" oninput="ajustarSintonia(this.value)">
      </div>

      <div class="estilo-box">
        <label for="select-estilo"><i class="fas fa-tv"></i> Modelo TV:</label>
        <select id="select-estilo" onchange="cambiarEstiloTV(this.value)">
          <option value="tv-madera">1. Madera 80s</option>
          <option value="tv-neon">2. Cyberpunk Neón</option>
          <option value="tv-transparente">3. Plástico Purpura 90s</option>
          <option value="tv-gris">4. Gris Clásica</option>
          <option value="tv-rojo">5. Retro Pop Rojo</option>
          <option value="tv-portatil">6. Mini Portátil</option>
        </select>
      </div>
    </div>

  </div>

  <script>
    const reproductor = document.getElementById('reproductor');
    const marcoTV = document.getElementById('marco-tv');
    let listaCanales = [];
    let canalActualIndex = 0;

    // --- ALMACENAMIENTO LOCAL (localStorage) ---
    function guardarCanales() {
      localStorage.setItem('retro_tv_canales', JSON.stringify(listaCanales));
    }

    function cargarCanalesGuardados() {
      const guardados = localStorage.getItem('retro_tv_canales');
      if (guardados) {
        listaCanales = JSON.parse(guardados);
      } else {
        // Canales por defecto si no hay guardados
        listaCanales = [
          'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4',
          'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4'
        ];
        guardarCanales();
      }
      reproducirCanalActual();
    }

    // --- LÓGICA DE REPRODUCCIÓN ---
    function reproducirCanalActual() {
      if (listaCanales.length > 0) {
        reproductor.src = listaCanales[canalActualIndex];
        reproductor.play().catch(() => {});
      }
    }

    function cambiarCanal(direccion) {
      if (listaCanales.length === 0) return;
      canalActualIndex = (canalActualIndex + direccion + listaCanales.length) % listaCanales.length;
      reproducirCanalActual();
    }

    function agregarCanal() {
      const url = prompt("Ingresa la URL del video o transmisión (.mp4 / .m3u8):");
      if (url) {
        listaCanales.push(url);
        guardarCanales();
        canalActualIndex = listaCanales.length - 1;
        reproducirCanalActual();
        alert("¡Canal guardado con éxito!");
      }
    }

    function ajustarVolumen(cambio) {
      reproductor.muted = false;
      let nuevoVolumen = reproductor.volume + cambio;
      if (nuevoVolumen > 1) nuevoVolumen = 1;
      if (nuevoVolumen < 0) nuevoVolumen = 0;
      reproductor.volume = nuevoVolumen;
    }

    // --- FUNCIONES EXTRAS (SINTONIZADOR Y ESTILOS) ---
    function ajustarSintonia(valor) {
      const opacidad = valor / 100;
      const desfoque = (100 - valor) / 10;
      reproductor.style.filter = `blur(${desfoque}px) opacity(${opacidad})`;
    }

    function cambiarEstiloTV(estilo) {
      marcoTV.className = 'tv-container ' + estilo;
      localStorage.setItem('retro_tv_estilo', estilo);
    }

    function pantallaCompleta() {
      if (reproductor.requestFullscreen) {
        reproductor.requestFullscreen();
      } else if (reproductor.webkitRequestFullscreen) {
        reproductor.webkitRequestFullscreen();
      }
    }

    function togglePower() {
      if (reproductor.style.display === 'none') {
        reproductor.style.display = 'block';
        reproductor.play();
      } else {
        reproductor.style.display = 'none';
        reproductor.pause();
      }
    }

    // --- INICIALIZACIÓN ---
    document.addEventListener('DOMContentLoaded', () => {
      cargarCanalesGuardados();

      // Restaurar estilo preferido si existe
      const estiloGuardado = localStorage.getItem('retro_tv_estilo');
      if (estiloGuardado) {
        marcoTV.className = 'tv-container ' + estiloGuardado;
        document.getElementById('select-estilo').value = estiloGuardado;
      }
    });
  </script>
</body>
</html>
