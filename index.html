<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Retro TV 90</title>
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0e0e10;
      color: #ffffff;
      font-family: 'Roboto', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .tv-wrapper {
      width: 100%;
      max-width: 920px;
      background: #1b1b1f;
      border: 2px solid #2e2e34;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Encabezado original */
    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2c2c32;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'Orbitron', sans-serif;
      text-transform: uppercase;
    }

    .brand-title .retro {
      font-size: 18px;
      font-weight: 800;
      color: #f4f4f6;
      letter-spacing: 1px;
    }

    .brand-title .tv90 {
      background: #e63946;
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      padding: 3px 7px;
      border-radius: 4px;
    }

    .ch-badge-top {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: #00f5d4;
      background: #121215;
      padding: 5px 12px;
      border-radius: 8px;
      border: 1px solid #2b2b33;
    }

    /* Info de canal y programación */
    .channel-info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #141417;
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid #28282f;
      gap: 10px;
      flex-wrap: wrap;
    }

    .channel-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .canal-label {
      font-weight: 700;
      font-size: 14px;
      color: #fff;
    }

    .live-pill {
      background: #e63946;
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .program-name {
      font-size: 13px;
      color: #a0a0ab;
    }

    /* Pantalla limpia sin líneas */
    .screen-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #2a2a30;
    }

    video, #yt-box {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    video {
      object-fit: contain;
      background: #000;
    }

    #yt-box {
      display: none;
    }

    .power-off-layer {
      position: absolute;
      inset: 0;
      background: #050507;
      display: none;
      z-index: 15;
    }

    /* Barra de tiempo estilo original */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #9e9ea8;
      font-family: 'Orbitron', sans-serif;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #2a2a32;
      border-radius: 99px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #00f5d4;
      transition: width 0.2s linear;
    }

    /* Buscador rápido integrado */
    .tools-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .search-input {
      flex: 1 1 220px;
      background: #121215;
      border: 1px solid #32323b;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: #00f5d4;
    }

    /* Botonera principal */
    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .btn-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: #27272e;
      color: #f4f4f6;
      border: 1px solid #383842;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn:hover {
      background: #34343e;
    }

    .btn-accent {
      background: #00b4d8;
      color: #000;
      border-color: #00b4d8;
    }

    .btn-accent:hover {
      background: #48cae4;
    }

    .btn-danger {
      background: #d62828;
      color: #fff;
      border-color: #d62828;
    }

    /* Lista de canales */
    .channels-list {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .channel-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141417;
      border: 1px solid #2b2b33;
      color: #d0d0d8;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
    }

    .channel-item.active {
      background: #00f5d4;
      color: #000;
      font-weight: 700;
      border-color: #00f5d4;
    }

    .del-ch {
      background: rgba(0, 0, 0, 0.25);
      border: none;
      color: inherit;
      font-weight: bold;
      border-radius: 4px;
      padding: 0 5px;
      cursor: pointer;
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 14px;
    }

    .modal-bg.open {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #1b1b1f;
      border: 1px solid #353540;
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-card h3 {
      font-size: 16px;
      color: #00f5d4;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group label {
      font-size: 13px;
      color: #bbb;
    }

    .form-group input, .form-group select {
      background: #121215;
      border: 1px solid #34343e;
      color: #fff;
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: #00f5d4;
      color: #000;
      font-weight: 700;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      display: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <div class="tv-wrapper">
    <!-- Encabezado original -->
    <div class="tv-header">
      <div class="brand-title">
        <span class="retro">retro</span>
        <span class="tv90">tv 90</span>
      </div>
      <div class="ch-badge-top" id="top-ch">CH 02</div>
    </div>

    <!-- Barra de info del canal -->
    <div class="channel-info-bar">
      <div class="channel-meta">
        <span class="canal-label" id="info-canal">CANAL 02</span>
        <span class="live-pill" id="info-badge">EN VIVO</span>
        <span class="program-name" id="info-programa">Sin Programación</span>
      </div>
    </div>

    <!-- Pantalla de video limpia (sin rayas) -->
    <div class="screen-container">
      <video id="main-video" playsinline controls></video>
      <div id="yt-box"><div id="yt-player"></div></div>
      <div class="power-off-layer" id="power-off"></div>
    </div>

    <!-- Barra de progreso y tiempos -->
    <div class="progress-row">
      <span id="time-current">00:00</span>
      <div class="progress-track" onclick="adelantarBarra(event)">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span id="time-total">00:00</span>
    </div>

    <!-- Buscador de YouTube + Cargar videos del dispositivo -->
    <div class="tools-row">
      <input
        type="text"
        id="yt-input"
        class="search-input"
        placeholder="Buscar en YouTube o pegar link de video / playlist..."
        onkeydown="if(event.key==='Enter') buscarOCargarYT()"
      >
      <button class="btn btn-accent" onclick="buscarOCargarYT()">YouTube</button>
      <button class="btn" onclick="document.getElementById('local-files').click()">Cargar Videos</button>
      <input type="file" id="local-files" accept="video/*" multiple style="display:none" onchange="cargarVideosLocales(event)">
    </div>

    <!-- Controles principales -->
    <div class="controls-bar">
      <div class="btn-group">
        <button class="btn" onclick="canalAnterior()">CH -</button>
        <button class="btn" onclick="canalSiguiente()">CH +</button>
        <button class="btn" id="btn-mute" onclick="toggleAudio()">Audio</button>
      </div>

      <div class="btn-group">
        <button class="btn" onclick="abrirModal()">+ Canal</button>
        <button class="btn" onclick="compartirActual()">Compartir</button>
        <button class="btn btn-danger" onclick="togglePower()">Power</button>
      </div>
    </div>

    <!-- Parrilla de canales -->
    <div class="channels-list" id="channels-list"></div>
  </div>

  <!-- Modal agregar canal -->
  <div class="modal-bg" id="modal-canal">
    <div class="modal-card">
      <h3>Agregar Canal</h3>
      <div class="form-group">
        <label>Nombre del canal</label>
        <input type="text" id="in-nombre" placeholder="Ej. Saint Seiya El Lienzo Perdido">
      </div>
      <div class="form-group">
        <label>Programa / Descripción</label>
        <input type="text" id="in-prog" placeholder="Ej. Español Latino">
      </div>
      <div class="form-group">
        <label>Tipo</label>
        <select id="in-tipo">
          <option value="youtube_playlist">Playlist de YouTube (Link o ID)</option>
          <option value="youtube_video">Video de YouTube (Link o ID)</option>
          <option value="hls">Canal en Vivo (.m3u8)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Enlace o ID</label>
        <input type="text" id="in-valor" placeholder="Pega aquí el link de YouTube o .m3u8">
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="cerrarModal()">Cancelar</button>
        <button class="btn btn-accent" onclick="guardarCanal()">Guardar</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // =====================================================
    // CANALES EN ESPAÑOL LATINO POR DEFECTO
    // =====================================================
    const CANALES_DEFAULT = [
      {
        id: "ch02",
        numero: "02",
        nombre: "Caricaturas Retro Latino",
        programa: "Clásicos Animados en Español Latino",
        tipo: "youtube_playlist",
        valor: "PLw7p49wK5d8W_1Y3G2p4W1q1F8_2t8r7N"
      },
      {
        id: "ch03",
        numero: "03",
        nombre: "Anime Español Latino",
        programa: "Maratón Anime Latino",
        tipo: "youtube_playlist",
        valor: "PLJ-27239564587412"
      },
      {
        id: "ch04",
        numero: "04",
        nombre: "Lucha Libre AAA",
        programa: "Funciones Completas en Español",
        tipo: "youtube_playlist",
        valor: "PL9352431377997654"
      },
      {
        id: "ch05",
        numero: "05",
        nombre: "Noticias y Deportes",
        programa: "DW Español En Vivo 24/7",
        tipo: "hls",
        valor: "https://dwamdstream104.akamaized.net/hls/live/2015530/dwstream104/index.m3u8"
      },
      {
        id: "ch06",
        numero: "06",
        nombre: "Cine Español Latino",
        programa: "Películas Completas en Español",
        tipo: "youtube_playlist",
        valor: "PL3002579207484830"
      }
    ];

    // =====================================================
    // ALMACENAMIENTO PERSISTENTE (localStorage + IndexedDB)
    // =====================================================
    const LS_KEY = "retrotv90_latino_canales_v2";
    const DB_NAME = "RetroTV90DB";
    const STORE_NAME = "config";

    function abrirDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => req.result.createObjectStore(STORE_NAME);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function guardarPersistente(listaCanales) {
      const json = JSON.stringify(listaCanales);
      try { localStorage.setItem(LS_KEY, json); } catch (e) {}
      try {
        const db = await abrirDB();
        const tx = db.transaction(STORE_NAME, "readwrite");
        tx.objectStore(STORE_NAME).put(json, LS_KEY);
      } catch (e) {}
    }

    async function leerPersistente() {
      // 1. Intentar desde URL compartida si trae canales
      const params = new URLSearchParams(window.location.search);
      if (params.get("c")) {
        try {
          const decodificados = JSON.parse(decodeURIComponent(atob(params.get("c"))));
          if (Array.isArray(decodificados) && decodificados.length) {
            await guardarPersistente(decodificados);
            return decodificados;
          }
        } catch (e) {}
      }

      // 2. Intentar IndexedDB (resiste reinicios de APK/WebView)
      try {
        const db = await abrirDB();
        const data = await new Promise((res) => {
          const tx = db.transaction(STORE_NAME, "readonly");
          const r = tx.objectStore(STORE_NAME).get(LS_KEY);
          r.onsuccess = () => res(r.result);
          r.onerror = () => res(null);
        });
        if (data) {
          const parsed = JSON.parse(data);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}

      // 3. Intentar localStorage
      try {
        const ls = localStorage.getItem(LS_KEY);
        if (ls) {
          const parsed = JSON.parse(ls);
          if (Array.isArray(parsed) && parsed.length) return parsed;
        }
      } catch (e) {}

      return [...CANALES_DEFAULT];
    }

    // =====================================================
    // ESTADO Y REPRODUCTORES
    // =====================================================
    let canales = [];
    let indiceActual = 0;
    let encendida = true;
    let silenciado = false;
    let hls = null;
    let ytPlayer = null;
    let ytListo = false;
    let archivosLocales = [];
    let indiceLocal = 0;
    let enlaceCompartirActual = window.location.href;

    const videoEl = document.getElementById("main-video");
    const ytBox = document.getElementById("yt-box");
    const powerOffEl = document.getElementById("power-off");

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => { el.style.display = "none"; }, 2500);
    }

    function formatearTiempo(seg) {
      if (!isFinite(seg) || seg < 0) return "00:00";
      const m = Math.floor(seg / 60);
      const s = Math.floor(seg % 60);
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    // Actualizar barra de tiempo
    setInterval(() => {
      if (!encendida) return;
      if (videoEl.style.display !== "none" && videoEl.duration) {
        document.getElementById("time-current").textContent = formatearTiempo(videoEl.currentTime);
        document.getElementById("time-total").textContent = formatearTiempo(videoEl.duration);
        document.getElementById("progress-fill").style.width = `${(videoEl.currentTime / videoEl.duration) * 100}%`;
      } else if (ytListo && ytPlayer && ytPlayer.getCurrentTime && ytBox.style.display !== "none") {
        const cur = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;
        if (dur > 0) {
          document.getElementById("time-current").textContent = formatearTiempo(cur);
          document.getElementById("time-total").textContent = formatearTiempo(dur);
          document.getElementById("progress-fill").style.width = `${(cur / dur) * 100}%`;
        }
      }
    }, 500);

    function adelantarBarra(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      if (videoEl.style.display !== "none" && videoEl.duration) {
        videoEl.currentTime = pct * videoEl.duration;
      } else if (ytListo && ytPlayer && ytPlayer.getDuration) {
        const dur = ytPlayer.getDuration();
        if (dur) ytPlayer.seekTo(pct * dur, true);
      }
    }

    function extraerVideoID(txt) {
      const s = txt.trim();
      if (/^[a-zA-Z0-9_-]{11}$/.test(s)) return s;
      const m = s.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{11})/);
      return m ? m[1] : null;
    }

    function extraerPlaylistID(txt) {
      const s = txt.trim();
      if (/^(PL|UU|FL|OL|RD)[a-zA-Z0-9_-]+$/.test(s)) return s;
      const m = s.match(/[?&]list=([a-zA-Z0-9_-]+)/);
      return m ? m[1] : null;
    }

    function renderizarCanales() {
      const cont = document.getElementById("channels-list");
      cont.innerHTML = "";
      canales.forEach((ch, idx) => {
        const item = document.createElement("div");
        item.className = "channel-item" + (idx === indiceActual ? " active" : "");
        item.onclick = () => sintonizar(idx);

        const span = document.createElement("span");
        span.textContent = `CH ${ch.numero} · ${ch.nombre}`;
        item.appendChild(span);

        if (ch.personalizado) {
          const del = document.createElement("button");
          del.className = "del-ch";
          del.textContent = "×";
          del.title = "Eliminar canal";
          del.onclick = async (ev) => {
            ev.stopPropagation();
            canales.splice(idx, 1);
            await guardarPersistente(canales);
            if (indiceActual >= canales.length) indiceActual = 0;
            renderizarCanales();
            sintonizar(indiceActual);
            toast("Canal eliminado");
          };
          item.appendChild(del);
        }

        cont.appendChild(item);
      });
    }

    window.onYouTubeIframeAPIReady = function () {
      ytPlayer = new YT.Player("yt-player", {
        height: "100%",
        width: "100%",
        playerVars: {
          autoplay: 1,
          controls: 1,
          modestbranding: 1,
          rel: 0,
          hl: "es",
          playsinline: 1
        },
        events: {
          onReady: () => {
            ytListo = true;
            if (canales.length) sintonizar(indiceActual);
          }
        }
      });
    };

    function limpiarReproductores() {
      if (hls) {
        hls.destroy();
        hls = null;
      }
      videoEl.pause();
      videoEl.removeAttribute("src");
      if (ytListo && ytPlayer && ytPlayer.stopVideo) {
        try { ytPlayer.stopVideo(); } catch (e) {}
      }
      document.getElementById("time-current").textContent = "00:00";
      document.getElementById("time-total").textContent = "00:00";
      document.getElementById("progress-fill").style.width = "0%";
    }

    function sintonizar(idx) {
      if (!encendida || !canales.length) return;
      if (idx < 0) idx = canales.length - 1;
      if (idx >= canales.length) idx = 0;
      indiceActual = idx;

      const ch = canales[indiceActual];
      renderizarCanales();
      limpiarReproductores();

      document.getElementById("top-ch").textContent = `CH ${ch.numero}`;
      document.getElementById("info-canal").textContent = `CANAL ${ch.numero} · ${ch.nombre}`;
      document.getElementById("info-programa").textContent = ch.programa || "En transmisión";
      document.getElementById("info-badge").textContent = ch.tipo === "local" ? "LOCAL" : "EN VIVO";

      if (ch.tipo === "hls") {
        ytBox.style.display = "none";
        videoEl.style.display = "block";
        videoEl.muted = silenciado;
        enlaceCompartirActual = ch.valor;

        if (Hls.isSupported()) {
          hls = new Hls();
          hls.loadSource(ch.valor);
          hls.attachMedia(videoEl);
          hls.on(Hls.Events.MANIFEST_PARSED, () => videoEl.play().catch(() => {}));
        } else if (videoEl.canPlayType("application/vnd.apple.mpegurl")) {
          videoEl.src = ch.valor;
          videoEl.play().catch(() => {});
        }
      } else if (ch.tipo === "youtube_playlist") {
        const pid = extraerPlaylistID(ch.valor) || ch.valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        enlaceCompartirActual = `https://www.youtube.com/playlist?list=${pid}`;

        if (ytListo && ytPlayer) {
          ytPlayer.loadPlaylist({ list: pid, listType: "playlist", index: 0 });
          if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      } else if (ch.tipo === "youtube_video") {
        const vid = extraerVideoID(ch.valor) || ch.valor;
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        enlaceCompartirActual = `https://www.youtube.com/watch?v=${vid}`;

        if (ytListo && ytPlayer) {
          ytPlayer.loadVideoById(vid);
          if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
        }
      } else if (ch.tipo === "local") {
        ytBox.style.display = "none";
        videoEl.style.display = "block";
        videoEl.muted = silenciado;
        reproducirArchivoLocal(0);
      }
    }

    // =====================================================
    // CARGAR VIDEOS DEL DISPOSITIVO
    // =====================================================
    function cargarVideosLocales(event) {
      const files = Array.from(event.target.files || []);
      if (!files.length) return;

      archivosLocales = files.map(f => ({
        nombre: f.name,
        url: URL.createObjectURL(f)
      }));

      let idxLocalCh = canales.findIndex(c => c.tipo === "local");
      if (idxLocalCh === -1) {
        canales.push({
          id: "ch_local",
          numero: String(canales.length + 2).padStart(2, "0"),
          nombre: "Videos del Dispositivo",
          programa: archivosLocales[0].nombre,
          tipo: "local",
          valor: ""
        });
        idxLocalCh = canales.length - 1;
      }

      sintonizar(idxLocalCh);
      toast(`${files.length} video(s) cargados`);
    }

    function reproducirArchivoLocal(i) {
      if (!archivosLocales.length) return;
      if (i >= archivosLocales.length) i = 0;
      indiceLocal = i;
      const archivo = archivosLocales[indiceLocal];
      document.getElementById("info-programa").textContent = `${archivo.nombre} (${indiceLocal + 1}/${archivosLocales.length})`;
      videoEl.src = archivo.url;
      videoEl.play().catch(() => {});
      videoEl.onended = () => reproducirArchivoLocal(indiceLocal + 1);
    }

    // =====================================================
    // BUSCADOR DE YOUTUBE
    // =====================================================
    function buscarOCargarYT() {
      const q = document.getElementById("yt-input").value.trim();
      if (!q) return;

      const pid = extraerPlaylistID(q);
      const vid = extraerVideoID(q);

      if (pid) {
        limpiarReproductores();
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        document.getElementById("info-canal").textContent = "YOUTUBE PLAYLIST";
        document.getElementById("info-programa").textContent = `Lista: ${pid}`;
        enlaceCompartirActual = `https://www.youtube.com/playlist?list=${pid}`;
        if (ytListo) ytPlayer.loadPlaylist({ list: pid, listType: "playlist", index: 0 });
      } else if (vid) {
        limpiarReproductores();
        videoEl.style.display = "none";
        ytBox.style.display = "block";
        document.getElementById("info-canal").textContent = "YOUTUBE VIDEO";
        document.getElementById("info-programa").textContent = `Video: ${vid}`;
        enlaceCompartirActual = `https://www.youtube.com/watch?v=${vid}`;
        if (ytListo) ytPlayer.loadVideoById(vid);
      } else {
        window.open(`https://www.youtube.com/results?search_query=${encodeURIComponent(q + " español latino")}`, "_blank");
      }
    }

    // =====================================================
    // AGREGAR Y GUARDAR CANALES
    // =====================================================
    function abrirModal() { document.getElementById("modal-canal").classList.add("open"); }
    function cerrarModal() { document.getElementById("modal-canal").classList.remove("open"); }

    async function guardarCanal() {
      const nombre = document.getElementById("in-nombre").value.trim();
      const programa = document.getElementById("in-prog").value.trim() || "Español Latino";
      const tipo = document.getElementById("in-tipo").value;
      const valor = document.getElementById("in-valor").value.trim();

      if (!nombre || !valor) {
        toast("Escribe el nombre y pega el enlace");
        return;
      }

      const numero = String(canales.length + 2).padStart(2, "0");
      canales.push({
        id: "ch_" + Date.now(),
        numero,
        nombre,
        programa,
        tipo,
        valor,
        personalizado: true
      });

      await guardarPersistente(canales);
      document.getElementById("in-nombre").value = "";
      document.getElementById("in-prog").value = "";
      document.getElementById("in-valor").value = "";
      cerrarModal();
      renderizarCanales();
      sintonizar(canales.length - 1);
      toast("Canal guardado permanentemente");
    }

    function canalSiguiente() { sintonizar(indiceActual + 1); }
    function canalAnterior() { sintonizar(indiceActual - 1); }

    function toggleAudio() {
      silenciado = !silenciado;
      videoEl.muted = silenciado;
      if (ytListo && ytPlayer) {
        if (silenciado) ytPlayer.mute(); else ytPlayer.unMute();
      }
      document.getElementById("btn-mute").textContent = silenciado ? "Silenciado" : "Audio";
    }

    function togglePower() {
      encendida = !encendida;
      if (!encendida) {
        powerOffEl.style.display = "block";
        limpiarReproductores();
      } else {
        powerOffEl.style.display = "none";
        sintonizar(indiceActual);
      }
    }

    async function compartirActual() {
      // Genera enlace que además incluye tus canales guardados
      const encoded = btoa(encodeURIComponent(JSON.stringify(canales)));
      const urlConCanales = `${window.location.origin}${window.location.pathname}?c=${encoded}`;

      if (navigator.share) {
        try {
          await navigator.share({
            title: "Retro TV 90",
            text: "Mira mi lista de canales en Retro TV 90",
            url: urlConCanales
          });
          return;
        } catch (e) {}
      }

      try {
        await navigator.clipboard.writeText(urlConCanales);
        toast("Enlace con tus canales copiado");
      } catch (e) {
        prompt("Copia este enlace:", urlConCanales);
      }
    }

    // Arrancar cargando los canales persistentes
    (async function init() {
      canales = await leerPersistente();
      renderizarCanales();
      if (ytListo) sintonizar(0);
    })();
  </script>
</body>
